<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function validateForm() {
            let emailField = document.getElementById("email");
            let passwordField = document.getElementById("password");
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(emailField.value)) {
                emailField.setCustomValidity("Please enter a valid email address, e.g., example@mail.com");
            } else {
                emailField.setCustomValidity("");
            }

            if (passwordField.value.length < 6) {
                passwordField.setCustomValidity("Password must be at least 6 characters long.");
            } else {
                passwordField.setCustomValidity("");
            }
            
            return emailField.reportValidity() && passwordField.reportValidity();
        }

        document.addEventListener("DOMContentLoaded", function () {
            let emailField = document.getElementById("email");
            emailField.addEventListener("input", function () {
                if (!emailField.validity.valid) {
                    emailField.setCustomValidity("Please enter a valid email address, e.g., example@mail.com");
                } else {
                    emailField.setCustomValidity("");
                }
            });

            let passwordField = document.getElementById("password");
            passwordField.addEventListener("input", function () {
                if (passwordField.value.length < 6) {
                    passwordField.setCustomValidity("Password must be at least 6 characters long.");
                } else {
                    passwordField.setCustomValidity("");
                }
            });
        });
    </script>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .login-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        .btn-custom {
            background: #4d4b4b;
            color: white;
        }
        .btn-custom:hover {
            background: #000000;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">G2 Medical Center</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Doctors</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Services</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Departments
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Department of internal medicine</a></li>
                  <li><a class="dropdown-item" href="#">Department of orthopedics</a></li>
                  <li><a class="dropdown-item" href="#">Department of neurosurgery</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    <!-- Improved Login Page -->
    <div class="login-card text-center">
        <img src="./img_avatar.png" alt="User Avatar">
        <h4 class="mt-3">Welcome to G2 Medical Center!</h4>
        <p>Hope you have a great day^_^</p>
        <p>Sign in to continue</p>
        <form onsubmit="return validateForm()">
            <div class="mb-3 text-start">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Sign In</button>
            <div class="mt-3">
                <a href="#" class="text-decoration-none">Forgot password?</a>
            </div>
        </form>
        <p><br>or</p>
        <div class="mt-3">
            <p>Don't have an account?</p>
            <button type="button" class="btn btn-custom w-100">Sign Up</button>
        </div>
    </div>
</body>
</html>
